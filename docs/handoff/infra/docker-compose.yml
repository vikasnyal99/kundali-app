# Local development ONLY; production must use managed secrets, TLS, backups and hardened networking.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kundli
      POSTGRES_USER: kundli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kundli"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devminio-password-change}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  # API and worker services added during implementation after Dockerfile exists.
volumes:
  pgdata:
  redisdata:
  miniodata:
